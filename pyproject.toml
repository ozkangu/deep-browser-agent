[project]
name = "deep-browser-agent"
version = "0.2.0"
description = "Browser automation agent: LangGraph DeepAgent + Chrome DevTools MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.4.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    # Default LLM providers — covers most use cases out of the box
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    # HTTP server
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Additional LLM providers
google = ["langchain-google-genai>=2.0.0"]
ollama = ["langchain-ollama>=0.3.0"]

# All providers (adds Google + Ollama on top of defaults)
all-providers = [
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
]

# DeepAgent support
deep = ["deepagents>=0.1.0"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[project.scripts]
deep-browser-agent = "deep_browser_agent.cli:main"
deep-browser-agent-server = "deep_browser_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_browser_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
