[project]
name = "deep-browser-agent"
version = "0.2.0"
description = "Browser automation agent: LangGraph DeepAgent + Chrome DevTools MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.4.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# LLM Providers — install what you need
anthropic = ["langchain-anthropic>=0.3.0"]
openai = ["langchain-openai>=0.3.0"]
google = ["langchain-google-genai>=2.0.0"]
ollama = ["langchain-ollama>=0.3.0"]
openrouter = ["langchain-openai>=0.3.0"]
azure = ["langchain-openai>=0.3.0"]

# All providers
all-providers = [
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
]

# DeepAgent support
deep = ["deepagents>=0.1.0"]
# NOTE: deepmcpagent is incompatible with deepagents (langgraph version conflict).
# Install separately: pip install "deepmcpagent[deep]" in a dedicated venv.

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[project.scripts]
deep-browser-agent = "deep_browser_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_browser_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
